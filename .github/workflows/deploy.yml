name: Deploy to Hostinger

# Auto-deploys the built site to Hostinger over FTP on every push to `main`.
# You can also trigger it manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; cancel an older run if a newer push arrives.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Uploads the contents of dist/ to your subdomain's document root.
      # Configure these repository secrets in your repo settings:
      #   Settings → Secrets and variables → Actions → Secrets
      #     FTP_SERVER, FTP_USERNAME, FTP_PASSWORD,
      #     FTP_TARGET_DIR  (e.g. /domains/playb.in/public_html/Invest/)
      # Hostinger's FTP occasionally times out establishing the control
      # socket. Give it a longer timeout and retry once on failure so a
      # transient hiccup doesn't fail the deploy.
      # Hostinger's FTP frequently times out establishing the control socket.
      # We try up to three times: each attempt runs only if the previous one
      # failed, and only the final attempt is allowed to fail the job — so one
      # or two transient hiccups no longer mark the deploy red or block the
      # site update. The action resumes an interrupted sync, so retries are
      # incremental, not full re-uploads.
      - name: Deploy via FTP (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger's FTP cert is tied to a hostname, so FTPS over the IP
          # fails cert checks. Plain ftp (port 21) is the reliable choice here.
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}

      - name: Deploy via FTP (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}

      - name: Deploy via FTP (attempt 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
