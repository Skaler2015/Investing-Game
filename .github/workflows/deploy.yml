name: Deploy to Hostinger

# Auto-deploys the built site to Hostinger over FTP on every push to `main`.
# You can also trigger it manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; cancel an older run if a newer push arrives.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Uploads the contents of dist/ to your subdomain's document root.
      # Configure the three secrets and the variable in your repo settings:
      #   Settings → Secrets and variables → Actions
      #     Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      #     Variable:  FTP_TARGET_DIR  (e.g. /domains/invest.playb.in/public_html/)
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_TARGET_DIR }}
          # Uncomment to mirror exactly (deletes remote files not in dist/).
          # Only safe if FTP_TARGET_DIR points ONLY at this app's folder.
          # dangerous-clean-slate: true
